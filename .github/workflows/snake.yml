name: Generate Contribution Snake Animation

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Contribution Grid Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#4ade80&color_dots=#142017,#1b4324,#2d6a3f,#40916c,#52b788
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#4ade80&color_dots=#142017,#1b4324,#2d6a3f,#40916c,#52b788

      - name: Commit & Push Snake Assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync garden contribution snake animation"
          file_pattern: "assets/github-contribution-grid-snake*.svg"
