name: Generate Contribution Snake Animation

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Contribution Grid Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: RajJasani
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-light&color_snake=#0284c7&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#38bdf8&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Commit & Push Snake Assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync contribution snake animation"
          file_pattern: "assets/github-contribution-grid-snake*.svg"
